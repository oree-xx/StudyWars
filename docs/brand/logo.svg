<svg width="508" height="160" viewBox="0 0 508 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StudyWars">
  <title>StudyWars</title>
  <defs>
    <linearGradient id="wordGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="508" height="160" rx="24" fill="#0f172a"/>

  <g transform="translate(304.3 80)">
