<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StudyWars">
  <title>StudyWars</title>
  <defs>
    <linearGradient id="wordGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="28" fill="#0f172a"/>
  <ellipse cx="600" cy="130" rx="520" ry="150" fill="url(#glow)"/>

  <g transform="translate(600 130) scale(2.2)">
    <!-- lightning bolt accent -->
    <path d="M-173.715 -46 L-209.715 4 L-185.715 4 L-197.715 46 L-151.715 -10 L-177.715 -10 Z" fill="url(#boltGradient)"/>

    <text x="-131.715" y="22" text-anchor="start"
          font-family="Arial Black, 'Arial Bold', Arial, 'Segoe UI', system-ui, -apple-system, Helvetica, sans-serif"
          font-size="60" font-weight="900" letter-spacing="-1"
          stroke-width="1.5" paint-order="stroke fill" stroke-linejoin="round">
      <tspan fill="#f8fafc" stroke="#f8fafc">Study</tspan><tspan fill="url(#wordGradient)" stroke="#a78bfa">Wars</tspan>
    </text>
  </g>
</svg>
